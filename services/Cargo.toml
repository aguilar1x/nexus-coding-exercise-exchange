[package]
name = "services"
version = "0.1.0"
edition = "2024"
# Adding the `engine` binary made a bare `cargo run` ambiguous, which breaks the
# CLI examples in README.md. Keep `cargo run` meaning the feed; the engine is
# reached with `cargo run --bin engine`.
default-run = "services"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8.4"
rand = "0.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ratatui = "0.30.2"
